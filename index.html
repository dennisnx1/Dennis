<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Donation</title>

<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Lalezar', cursive;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
}

/* ویدیو بک گراند */
#bgVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    filter: brightness(0.45) blur(1px);
}

/* گرادینت روی ویدیو */
.overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, #7b2cff88, #16001fdd 75%);
    z-index: -1;
}

.container {
    text-align: center;
}

/* عنوان */
.title {
    font-size: 40px;
    margin-bottom: 35px;
    text-shadow:
        0 4px 15px rgba(0,0,0,.6),
        0 0 25px rgba(190,140,255,.7);
}

/* کارت بانکی */
.card {
    width: 380px;
    height: 250px;
    padding: 28px;
    border-radius: 24px;
    background: linear-gradient(135deg, #9f6bff, #4b1dbd);
    box-shadow:
        0 30px 60px rgba(0,0,0,.5),
        inset 0 0 40px rgba(255,255,255,.15);
    position: relative;
    overflow: hidden;
}

/* نور کارت */
.card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right,
        rgba(255,255,255,.35),
        transparent 45%);
}

/* شماره کارت */
.card-number {
    margin-top: 60px;
    font-size: 28px;
    letter-spacing: 3px;
    text-align: center;
    color: #f7edff;
    -webkit-text-stroke: 1px rgba(60,0,120,.9);
    text-shadow:
        0 4px 10px rgba(0,0,0,.7),
        0 0 14px rgba(210,170,255,.7);
}

/* دکمه کپی */
.copy-btn {
    margin-top: 30px;
    padding: 12px 28px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #e0c3ff, #a855f7);
    color: #2a003f;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,.4);
    transition: 0.25s;
}

.copy-btn:hover {
    transform: scale(1.1);
}

/* پیام کپی */
.copied {
    margin-top: 14px;
    font-size: 16px;
    color: #e9d5ff;
    opacity: 0;
    transition: 0.3s;
}
</style>
</head>

<body>

<!-- ویدیو بک گراند -->
<video id="bgVideo" autoplay loop muted playsinline>
    <source src="bg.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <div class="title">شماره کارت برای دونیت</div>

    <div class="card">
        <div class="card-number" id="cardNumber">
            6037&nbsp;6981&nbsp;1893&nbsp;0903
        </div>

        <button class="copy-btn" onclick="copyCard()">
            📋 کپی شماره کارت
        </button>

        <div class="copied" id="copiedText">
            ✅ شماره کارت کپی شد
        </div>
    </div>
</div>

<script>
function copyCard() {
    const number = "6037698118930903";

    // روش جدید
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(number).then(showCopied);
    } else {
        // fallback برای GitHub Pages قدیمی / موبایل
        const temp = document.createElement("textarea");
        temp.value = number;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        showCopied();
    }
}

function showCopied() {
    const text = document.getElementById("copiedText");
    text.style.opacity = 1;
    setTimeout(() => {
        text.style.opacity = 0;
    }, 2000);
}
</script>

</body>
</html>
