<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>My Bio Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body, html {
      height: 100%;
      overflow: hidden;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      background: rgba(0,0,0,0.4);
      text-align: center;
    }

    a {
      color: white;
      text-decoration: none;
      border: 1px solid white;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 10px;
      display: inline-block;
    }

    a:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>

<video autoplay muted loop>
  <source src="https://cdn.coverr.co/videos/coverr-gaming-night-6319/1080p.mp4" type="video/mp4">
</video>

<div class="content">
  <h1>اسم تو</h1>
  <p>Link in Bio</p>

  <a href="#">Instagram</a>
  <a href="#">YouTube</a>
  <a href="#">Discord</a>
</div>

</body>
</html>
