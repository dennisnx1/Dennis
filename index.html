<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Donation</title>

<link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Lalezar', cursive;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #7b2cff, #2b0a3d 70%);
    color: #fff;
}

.container {
    text-align: center;
}

.title {
    font-size: 38px;
    margin-bottom: 30px;
    text-shadow:
        0 4px 15px rgba(0,0,0,.5),
        0 0 20px rgba(180,120,255,.6);
}

.card {
    width: 380px;
    height: 250px;
    padding: 28px;
    border-radius: 22px;
    background: linear-gradient(135deg, #8f4bff, #4b1dbd);
    box-shadow:
        0 25px 50px rgba(0,0,0,.45),
        inset 0 0 40px rgba(255,255,255,.12);
    position: relative;
    overflow: hidden;
}

.card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right,
        rgba(255,255,255,.25),
        transparent 45%);
}

.card-number {
    margin-top: 55px;
    font-size: 27px;
    letter-spacing: 3px;
    text-align: center;
    color: #f5e9ff;
    -webkit-text-stroke: 1px rgba(60,0,120,.9);
    text-shadow:
        0 3px 8px rgba(0,0,0,.6),
        0 0 12px rgba(200,150,255,.6);
}

/* دکمه کپی */
.copy-btn {
    margin: 25px auto 0;
    display: inline-block;
    padding: 10px 26px;
    border-radius: 14px;
    background: linear-gradient(135deg, #c084fc, #8b5cf6);
    border: none;
    color: #2b0a3d;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
    transition: 0.25s;
}

.copy-btn:hover {
    transform: scale(1.08);
}

.copied {
    margin-top: 12px;
    font-size: 16px;
    color: #d8b4fe;
    opacity: 0;
    transition: 0.3s;
}
</style>
</head>

<body>

<div class="container">
    <div class="title">شماره کارت برای دونیت</div>

    <div class="card">
        <div class="card-number" id="cardNumber">
            6037&nbsp;6981&nbsp;1893&nbsp;0903
        </div>

        <button class="copy-btn" onclick="copyCard()">
            کپی شماره کارت
        </button>

        <div class="copied" id="copiedText">
            ✅ شماره کارت کپی شد
        </div>
    </div>
</div>

<script>
function copyCard() {
    const number = "6037698118930903";
    navigator.clipboard.writeText(number);

    const text = document.getElementById("copiedText");
    text.style.opacity = 1;

    setTimeout(() => {
        text.style.opacity = 0;
    }, 2000);
}
</script>

</body>
</html>
